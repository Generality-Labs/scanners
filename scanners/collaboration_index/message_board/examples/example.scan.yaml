name: collab-message-board-example
max_processes: 1
scanners:
- package: git+https://github.com/Generality-Labs/scanners@<SHA>#subdirectory=scanners/collaboration_index/message_board
  name: collab_message_board
  items:
  - name: board_journal
transcripts:
  sources:
  - eval_set_id: <EVAL_SET_ID>
  filter:
    where:
    - eval_status: success
runner:
  memory: 16Gi
  cpu: '2'
